name: T3 Code Maxi iPhone and iPad unsigned build
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      APP_VARIANT: preview
      T3CODE_IOS_PERSONAL_TEAM: "1"
      T3CODE_IOS_PERSONAL_TEAM_BUNDLE_ID: com.maximilian.t3code.mobile
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
      MOBILE_VERSION_POLICY: appVersion
      EXPO_NO_GIT_STATUS: "1"
      CI: "1"
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout approved public source
        shell: bash
        env:
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init
          git remote add origin "https://github.com/$BUILD_REPOSITORY.git"
          git fetch --depth=1 origin "$BUILD_SHA"
          git sparse-checkout init --no-cone
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/mobile...
              - --filter=@t3tools/scripts...
      - name: Verify source and resolved Maxi configuration
        working-directory: apps/mobile
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          ./node_modules/.bin/expo config --type public --json > "$RUNNER_TEMP/expo-config.json"
          python3 - "$RUNNER_TEMP/expo-config.json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding="utf-8") as source:
              config = json.load(source)
          assert config["name"] == "T3 Code Maxi"
          assert config["version"] == "2.2.1"
          assert config["ios"]["buildNumber"] == "5"
          assert config["ios"]["bundleIdentifier"] == "com.maximilian.t3code.mobile"
          assert config["ios"]["supportsTablet"] is True
          assert config["scheme"] == ["t3code-maxi", "t3code-preview"]
          assert config["updates"]["enabled"] is False
          assert "appleTeamId" not in config["ios"]
          print("Verified resolved Maxi config: 2.2.1 (5), tablet support, updates disabled, personal-team iOS.")
          PY
      - name: Generate iOS project
        working-directory: apps/mobile
        run: ./node_modules/.bin/expo prebuild --platform ios --no-install
      - name: Install native dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build unsigned app for device
        working-directory: apps/mobile
        shell: bash
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REPOSITORY: ${{ github.repository }}
          BUILD_RUN_ID: ${{ github.run_id }}
          BUILD_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          test "$(git rev-parse HEAD)" = "$BUILD_SHA"
          workspaces=(ios/*.xcworkspace)
          projects=(ios/*.xcodeproj)
          test "${#workspaces[@]}" -eq 1
          test "${#projects[@]}" -eq 1
          workspace="${workspaces[0]}"
          xcodebuild -list -json -project "${projects[0]}" > "$RUNNER_TEMP/schemes.json"
          scheme=$(node -e 'const d=require(process.argv[1]); const s=d.project.schemes; if(s.length!==1) process.exit(1); process.stdout.write(s[0]);' "$RUNNER_TEMP/schemes.json")
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphoneos -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO build
          apps=("$RUNNER_TEMP"/derived/Build/Products/Release-iphoneos/*.app)
          test "${#apps[@]}" -eq 1
          python3 - "${apps[0]}" "$RUNNER_TEMP/T3-Code-Maxi-unsigned.build-info.json" <<'PY'
          import json, os, plistlib, sys
          app, receipt = sys.argv[1:3]
          with open(os.path.join(app, "Info.plist"), "rb") as source:
              info = plistlib.load(source)
          schemes = {scheme for entry in info.get("CFBundleURLTypes", []) for scheme in entry.get("CFBundleURLSchemes", [])}
          assert info["CFBundleIdentifier"] == "com.maximilian.t3code.mobile"
          assert info["CFBundleDisplayName"] == "T3 Code Maxi"
          assert info["CFBundleShortVersionString"] == "2.2.1"
          assert info["CFBundleVersion"] == "5"
          assert not os.path.exists(os.path.join(app, "embedded.mobileprovision"))
          expo_plist = os.path.join(app, "Expo.plist")
          with open(expo_plist, "rb") as source:
              updates_enabled = plistlib.load(source)["EXUpdatesEnabled"]
          assert updates_enabled is False
          assert {1, 2}.issubset(set(info["UIDeviceFamily"]))
          assert {"t3code-maxi", "t3code-preview"}.issubset(schemes)
          with open(receipt, "w", encoding="utf-8") as out:
              json.dump({
                  "sourceCommit": os.environ["BUILD_SHA"],
                  "repository": os.environ["BUILD_REPOSITORY"],
                  "runId": os.environ["BUILD_RUN_ID"],
                  "runAttempt": os.environ["BUILD_RUN_ATTEMPT"],
                  "bundleIdentifier": info["CFBundleIdentifier"],
                  "marketingVersion": info["CFBundleShortVersionString"],
                  "buildNumber": info["CFBundleVersion"],
                  "requestedCodeSigningAllowed": False,
                  "signatureStatus": "not_inspected",
                  "provisioningProfilePresent": False,
                  "updatesEnabled": updates_enabled,
              }, out, indent=2)
              out.write("\n")
          print("Verified Maxi identity, version 2.2.1 (5), disabled updates and no provisioning profile, phone/tablet support and native thread-link schemes.")
          PY
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "${apps[0]}" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/T3-Code-Maxi-unsigned.ipa" Payload)
          shasum -a 256 "$RUNNER_TEMP/T3-Code-Maxi-unsigned.ipa" > "$RUNNER_TEMP/T3-Code-Maxi-unsigned.ipa.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: t3-code-maxi-ios-unsigned
          path: |
            ${{ runner.temp }}/T3-Code-Maxi-unsigned.ipa
            ${{ runner.temp }}/T3-Code-Maxi-unsigned.ipa.sha256
            ${{ runner.temp }}/T3-Code-Maxi-unsigned.build-info.json
          if-no-files-found: error
          retention-days: 7
